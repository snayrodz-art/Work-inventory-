<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{--blue:#163a63;--light:#eef4fa;--border:#d7dee7;--red:#b42318;--green:#067647;--bg:#f7f8fa}
*{box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:#17202a}
header{background:var(--blue);color:white;padding:22px 18px} header h1{margin:0;font-size:24px} header p{margin:6px 0 0;opacity:.85}
main{max-width:980px;margin:auto;padding:16px} .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:white;border:1px solid var(--border);border-radius:14px;padding:14px} .big{font-size:24px;font-weight:700}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0} input,select,button,textarea{font:inherit} input[type=search],select,.field{padding:12px;border:1px solid var(--border);border-radius:10px;background:white;min-height:44px}
input[type=search]{flex:1;min-width:200px} button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--blue);color:white;font-weight:650;min-height:44px}
button.secondary{background:white;color:var(--blue);border:1px solid var(--border)} button.danger{background:white;color:var(--red);border:1px solid #f1b7b2} button.small{padding:8px 10px;min-height:38px}
.item{background:white;border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 0} .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .name{flex:1;min-width:210px;font-weight:650} .meta{font-size:12px;color:#667085;margin-top:3px}
.qty{width:78px;padding:9px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:16px} .order{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;background:#f8fafc}
.order.yes{background:#fff1f0;color:var(--red);font-weight:650} .notes{width:100%;margin-top:9px;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:16px}
.cat{margin:22px 0 8px;font-size:17px;color:var(--blue)} #toast{color:var(--green);font-weight:650;margin:8px 0} .hidden{display:none!important}
.manager{background:#fff;border:2px solid var(--blue);border-radius:14px;padding:14px;margin:12px 0} .manager h2{margin:0 0 5px;color:var(--blue);font-size:20px} .manager p{margin:0 0 12px;color:#667085;font-size:14px}
.formgrid{display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:8px} .field{width:100%;font-size:16px} .manager-actions,.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .item-actions{display:none} body.manage-mode .item-actions{display:flex}
@media(max-width:700px){.summary{grid-template-columns:1fr 1fr} .summary .card:last-child{grid-column:1/-1} .formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.formgrid{grid-template-columns:1fr} header h1{font-size:21px}}
@media print{header,.controls,#finish,#toast,#manager,.item-actions{display:none!important} body{background:white} main{max-width:none} .item{break-inside:avoid}}
</style></head><body>
<header><h1>CSI Biweekly Inventory</h1><p>Master Inventory List • editable every two weeks</p></header>
<main>
<div class="summary"><div class="card"><div>Inventory items</div><div id="total" class="big">119</div></div><div class="card"><div>Need ordering</div><div id="needed" class="big">0</div></div><div class="card"><div>Last checked</div><div id="last" class="big" style="font-size:17px">Not yet</div><div id="next" class="meta"></div></div></div>
<div class="controls"><input id="search" type="search" placeholder="Search inventory…"><select id="filter"><option value="all">All categories</option></select><label class="order"><input id="only" type="checkbox"> Needs ordering only</label><button id="print" class="secondary">Print / Save PDF</button><button id="manage" class="secondary">⚙️ Manage List</button></div>
<div id="manager" class="manager hidden">
<h2 id="formTitle">Add a new inventory item</h2><p>You can add new items here. While Manage List is open, every inventory item also has Edit and Remove buttons.</p>
<form id="itemForm"><input type="hidden" id="editId"><div class="formgrid">
<input id="itemName" class="field" placeholder="Item name" required>
<input id="itemCategory" class="field" list="categoryList" placeholder="Category" required><datalist id="categoryList"></datalist>
<input id="itemQty" class="field" placeholder="Qty" value="0" required>
<input id="itemUnit" class="field" placeholder="Unit (boxes, rolls…)" required>
</div><div class="manager-actions"><button type="submit" id="saveItem">+ Add Item</button><button type="button" id="cancelEdit" class="secondary hidden">Cancel Edit</button><button type="button" id="closeManage" class="secondary">Done Managing</button></div></form>
</div>
<div id="toast"></div><div id="list"></div>
<button id="finish">✓ Finish this inventory check</button>
</main>

 document.getElementById('total').textContent=items.length;document.getElementById('needed').textContent=items.filter(x=>x.order).length;
 let groups=[...new Set(shown.map(x=>x.category))];
 document.getElementById('list').innerHTML=groups.map(c=>`<h2 class="cat">${esc(c)}</h2>`+shown.filter(x=>x.category===c).map(x=>`<div class="item"><div class="row"><div class="name">${esc(x.name)}<div class="meta">${esc(x.unit)}</div></div><input class="qty" data-id="${x.id}" data-type="qty" value="${esc(x.qty)}" aria-label="Quantity for ${esc(x.name)}"><label class="order ${x.order?'yes':''}"><input type="checkbox" data-id="${x.id}" data-type="order" ${x.order?'checked':''}> Order?</label></div><input class="notes" data-id="${x.id}" data-type="notes" value="${esc(x.notes||'')}" placeholder="Notes / what is needed…"><div class="item-actions"><button type="button" class="secondary small" data-action="edit" data-id="${x.id}">✏️ Edit Item</button><button type="button" class="danger small" data-action="remove" data-id="${x.id}">🗑 Remove</button></div></div>`).join('')).join('');
}
function resetForm(){document.getElementById('editId').value='';document.getElementById('itemName').value='';document.getElementById('itemCategory').value='';document.getElementById('itemQty').value='0';document.getElementById('itemUnit').value='';document.getElementById('formTitle').textContent='Add a new inventory item';document.getElementById('saveItem').textContent='+ Add Item';document.getElementById('cancelEdit').classList.add('hidden')}
function openManager(){document.body.classList.add('manage-mode');document.getElementById('manager').classList.remove('hidden');document.getElementById('manage').textContent='⚙️ Managing List…'}
function closeManager(){document.body.classList.remove('manage-mode');document.getElementById('manager').classList.add('hidden');document.getElementById('manage').textContent='⚙️ Manage List';resetForm()}
document.getElementById('manage').addEventListener('click',()=>document.body.classList.contains('manage-mode')?closeManager():openManager());document.getElementById('closeManage').addEventListener('click',closeManager);document.getElementById('cancelEdit').addEventListener('click',resetForm);
document.getElementById('itemForm').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('editId').value;const name=document.getElementById('itemName').value.trim(),category=document.getElementById('itemCategory').value.trim(),qty=document.getElementById('itemQty').value.trim(),unit=document.getElementById('itemUnit').value.trim();if(!name||!category||!unit)return;if(id){const x=items.find(i=>String(i.id)===String(id));if(x){x.name=name;x.category=category;x.qty=qty;x.unit=unit}}else{const nextId=items.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1;items.push({id:nextId,category,name,qty,unit,order:false,notes:''})}save();rebuildCategories();render();resetForm();document.getElementById('toast').textContent=id?'Item updated ✓':'New item added ✓';setTimeout(()=>document.getElementById('toast').textContent='',2500)});
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const x=items.find(i=>String(i.id)===String(b.dataset.id));if(!x)return;if(b.dataset.action==='remove'){if(confirm(`Remove “${x.name}” from the inventory list?`)){items=items.filter(i=>String(i.id)!==String(x.id));save();rebuildCategories();render();document.getElementById('toast').textContent='Item removed ✓';setTimeout(()=>document.getElementById('toast').textContent='',2500)}}else if(b.dataset.action==='edit'){openManager();document.getElementById('editId').value=x.id;document.getElementById('itemName').value=x.name;document.getElementById('itemCategory').value=x.category;document.getElementById('itemQty').value=x.qty;document.getElementById('itemUnit').value=x.unit;document.getElementById('formTitle').textContent='Edit inventory item';document.getElementById('saveItem').textContent='Save Changes';document.getElementById('cancelEdit').classList.remove('hidden');document.getElementById('manager').scrollIntoView({behavior:'smooth',block:'start'})}});
document.getElementById('list').addEventListener('change',e=>{let x=items.find(i=>String(i.id)===String(e.target.dataset.id));if(!x)return;if(e.target.dataset.type==='order')x.order=e.target.checked;else if(e.target.dataset.type==='qty')x.qty=e.target.value;else if(e.target.dataset.type==='notes')x.notes=e.target.value;save();render()});
document.getElementById('list').addEventListener('input',e=>{if(e.target.dataset.type==='notes'){let x=items.find(i=>String(i.id)===String(e.target.dataset.id));if(x){x.notes=e.target.value;save()}}});
document.getElementById('search').addEventListener('input',render);filter.addEventListener('change',render);document.getElementById('only').addEventListener('change',render);document.getElementById('print').addEventListener('click',()=>window.print());
function dates(){let s=localStorage.getItem('csiLastChecked');if(s){let d=new Date(s+'T12:00:00'),n=new Date(d);n.setDate(n.getDate()+14);document.getElementById('last').textContent=d.toLocaleDateString();document.getElementById('next').textContent='Next check: '+n.toLocaleDateString()}}
document.getElementById('finish').addEventListener('click',()=>{let d=new Date(),s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');localStorage.setItem('csiLastChecked',s);dates();document.getElementById('toast').textContent='Inventory check saved ✓';setTimeout(()=>document.getElementById('toast').textContent='',3000)});
rebuildCategories();dates();render();
</script></body></html>
